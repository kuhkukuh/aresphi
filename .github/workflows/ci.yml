name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Use a dummy database URL for build checks (Neon requires SSL)
  DATABASE_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable
  DATABASE_UNPOOLED_URL: postgresql://user:pass@localhost:5432/test?sslmode=disable

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  migration-check:
    name: Check Migration Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for diff

      - name: Check for pending migrations
        id: check-migrations
        run: |
          # Check if any migration files were added/modified
          if git diff --name-only origin/main...HEAD -- 'drizzle/*.sql' | grep -q .; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "### 📋 Migration Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following migration files were added or modified:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git diff --name-only origin/main...HEAD -- 'drizzle/*.sql' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ These migrations will be applied automatically when merged to main." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No migration changes detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate migration files
        if: steps.check-migrations.outputs.has_migrations == 'true'
        run: |
          echo "Validating migration files exist and are readable..."
          for file in drizzle/*.sql; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file"
              # Check file is not empty
              if [ ! -s "$file" ]; then
                echo "❌ Error: $file is empty"
                exit 1
              fi
            fi
          done
          echo "All migration files valid."
