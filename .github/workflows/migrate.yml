name: Apply Migrations

on:
  push:
    branches: [main]
    paths:
      - 'drizzle/*.sql'
      - 'src/infrastructure/database/schema.ts'
      - '.github/workflows/migrate.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate
        env:
          DATABASE_UNPOOLED_URL: ${{ secrets.DATABASE_UNPOOLED_URL }}

      - name: Migration Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Migrations Applied Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Migration Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: migrate
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Database Migration Failed',
              body: `## Migration Failure

              The automated database migration workflow failed.

              **Workflow Run**: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

              **Commit**: ${context.sha}

              **Triggered by**: ${context.actor}

              ### Action Required
              1. Check the workflow logs for error details
              2. Fix any migration issues
              3. Re-run the workflow manually if needed

              ---
              *This issue was automatically created by the CI pipeline.*
              `,
              labels: ['migration', 'urgent', 'ci']
            })
